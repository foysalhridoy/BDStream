<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="bdDarkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181c" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="limeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4ff00" />
      <stop offset="100%" stop-color="#a3e635" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e4e4e7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#d4ff00" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Dark Rounded Squircle Base (66l.vercel.app modern aesthetic) -->
  <rect
    x="4"
    y="4"
    width="92"
    height="92"
    rx="26"
    fill="url(#bdDarkBg)"
    stroke="#27272a"
    stroke-width="3"
  />

  <!-- Subtle Inner Border Accent -->
  <rect
    x="7"
    y="7"
    width="86"
    height="86"
    rx="23"
    fill="none"
    stroke="#d4ff00"
    stroke-width="1.5"
    stroke-opacity="0.25"
  />

  <!-- BDStream Monogram: 'B' -->
  <path
    d="M20 27C20 24.7909 21.7909 23 24 23H37C43.0751 23 48 27.9249 48 34C48 37.8931 45.9757 41.3142 42.9234 43.2721C46.6198 45.1952 49.1429 49.0305 49.1429 53.5C49.1429 60.4036 43.5464 66 36.6429 66H24C21.7909 66 20 64.2091 20 62V27Z"
    fill="url(#cyanGrad)"
  />
  <!-- 'B' Cutouts -->
  <path
    d="M28 31V41H36C38.2091 41 40 39.2091 40 37C40 34.7909 38.2091 33 36 33H28ZM28 48V58H36.5C38.9853 58 41 55.9853 41 53.5C41 51.0147 38.9853 49 36.5 49H28Z"
    fill="#09090b"
  />

  <!-- Forward High-Speed Stream Triangle (The 'Play' & 'D' Stream Flow) -->
  <path
    d="M50 31C50 28.6723 52.5532 27.2407 54.5385 28.4552L79.0385 43.4552C80.9871 44.6475 80.9871 47.4525 79.0385 48.6448L54.5385 63.6448C52.5532 64.8593 50 63.4277 50 61.1L50 31Z"
    fill="url(#limeGrad)"
    filter="url(#glow)"
  />

  <!-- High-Speed Stream Trail lines -->
  <rect x="20" y="73" width="34" height="4" rx="2" fill="#d4ff00" />
  <rect x="58" y="73" width="16" height="4" rx="2" fill="#d4ff00" opacity="0.6" />
  <rect x="78" y="73" width="6" height="4" rx="2" fill="#d4ff00" opacity="0.3" />

  <!-- Live Green Dot -->
  <circle cx="80" cy="20" r="4.5" fill="#d4ff00" />
  <circle cx="80" cy="20" r="2" fill="#ffffff" />
</svg>
